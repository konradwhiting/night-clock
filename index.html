<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Night Clock">
<meta name="theme-color" content="#050303">
<meta name="color-scheme" content="dark">
<title>Night Clock</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="fonts/dseg7-classic-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500&amp;family=Barlow:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

<main id="app">
  <section class="city" id="city-syd" aria-label="Earlwood">
    <div class="top">
      <header class="city-head">
        <span class="city-name">Earlwood</span>
        <span class="city-meta" id="syd-meta"></span>
      </header>
      <div class="time"><span class="ghost" aria-hidden="true">88:88</span><span class="hm" id="syd-hm">--:--</span><span class="ap" id="syd-ap"></span></div>
      <div class="date-row">
        <div class="date" id="syd-date"></div>
        <div class="wx-now">
          <span class="wx-temp" id="syd-temp">--°</span>
          <span class="wx-desc" id="syd-desc">Loading forecast</span>
        </div>
      </div>
    </div>
    <div class="news news-list" id="syd-news" hidden></div>
  </section>

  <section class="city" id="city-uk" aria-label="Eastbourne">
    <div class="top">
      <header class="city-head">
        <span class="city-name">Eastbourne</span>
        <span class="city-meta" id="uk-meta"></span>
      </header>
      <div class="time"><span class="ghost" aria-hidden="true">88:88</span><span class="hm" id="uk-hm">--:--</span><span class="ap" id="uk-ap"></span></div>
      <div class="date-row">
        <div class="date" id="uk-date"></div>
        <div class="wx-now">
          <span class="wx-temp" id="uk-temp">--°</span>
          <span class="wx-desc" id="uk-desc">Loading forecast</span>
        </div>
      </div>
    </div>
    <div class="news news-list" id="uk-news" hidden></div>
  </section>

  <footer id="foot"></footer>
  <button type="button" id="btn-news-page" aria-label="Refresh news">↻ News</button>
</main>

<nav id="controls" hidden aria-label="Display settings">
  <button type="button" id="btn-hours"></button>
  <button type="button" id="btn-theme"></button>
  <button type="button" id="btn-dim"></button>
  <button type="button" id="btn-news">Refresh news</button>
  <button type="button" id="btn-full" hidden></button>
  <span id="awake"></span>
</nav>

<script>window.NIGHT_CLOCK = { themes: true };</script>
<script src="app.js?v=3"></script>
</body>
</html>
