<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Earlwood Clock">
<meta name="theme-color" content="#050303">
<meta name="color-scheme" content="dark">
<title>Earlwood Clock</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="../fonts/dseg7-classic-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500&amp;family=Barlow:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

<main id="app" class="solo">
  <section class="city" id="city-syd" aria-label="Earlwood">
    <div class="top">
      <header class="city-head">
        <span class="city-name">Earlwood</span>
        <span class="city-meta" id="syd-meta"></span>
      </header>
      <div class="time"><span class="ghost" aria-hidden="true">88:88</span><span class="hm" id="syd-hm">--:--</span><span class="ap" id="syd-ap"></span></div>
      <div class="date" id="syd-date"></div>
    </div>
    <div class="wx wx-rainy wx-text">
      <div class="wx-now">
        <span class="wx-temp" id="syd-temp">--°</span>
        <span class="wx-desc" id="syd-desc">Loading forecast</span>
        <span class="wx-range" id="syd-range"></span>
      </div>
      <div class="rain-head" id="syd-rain-head"></div>
      <div class="rain-sub" id="syd-rain-sub"></div>
      <div class="rain-next" id="syd-nc-cap"></div>
      <div class="wx-grid" id="syd-grid"></div>
      <div class="rail" id="rail" aria-live="polite">
        <span class="rail-line">Light rail L1 Dulwich Hill</span>
        <span class="rail-head" id="rail-head">Checking</span>
        <span class="rail-sub" id="rail-sub"></span>
      </div>
    </div>
  </section>

  <footer id="foot"></footer>
</main>

<nav id="controls" hidden aria-label="Display settings">
  <button type="button" id="btn-dim"></button>
  <button type="button" id="btn-full" hidden></button>
  <span id="awake"></span>
</nav>

<script>window.NIGHT_CLOCK = { cities: ['syd'], base: '../', cache: 'earlwood.' };</script>
<script src="../app.js"></script>
</body>
</html>
