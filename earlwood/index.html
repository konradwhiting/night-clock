<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Earlwood Clock">
<meta name="theme-color" content="#050303">
<meta name="color-scheme" content="dark">
<title>Earlwood Clock</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="../fonts/dseg7-classic-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500&amp;family=Barlow:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

<main id="app" class="solo">
  <section class="city" id="city-syd" aria-label="Earlwood">
    <div class="top">
      <div class="time"><span class="ghost" aria-hidden="true">88:88</span><span class="hm" id="syd-hm">--:--</span><span class="ap" id="syd-ap"></span></div>
      <div class="date" id="syd-date"></div>
      <span class="city-meta" id="syd-meta" hidden></span>
    </div>
    <div class="rows">
      <div class="row quiet" id="rail" aria-live="polite">
        <div class="ico" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M32 8V2M20 2h24"/><rect x="14" y="8" width="36" height="38" rx="6"/><rect x="20" y="14" width="24" height="14" rx="2"/><circle cx="22" cy="38" r="2.5"/><circle cx="42" cy="38" r="2.5"/><path d="M22 46l-6 12M42 46l6 12"/></svg></div>
        <div class="row-body">
          <div class="row-label">Light rail L1 Dulwich Hill</div>
          <div class="row-word" id="rail-head">Checking</div>
          <div class="row-sub" id="rail-sub"></div>
        </div>
      </div>
      <div class="row" id="tile-wear">
        <div class="ico" id="wear-ico" aria-hidden="true"></div>
        <div class="row-body">
          <div class="row-label">What to wear</div>
          <div class="row-word" id="syd-wear">--</div>
          <div class="row-sub" id="syd-wear-sub"></div>
        </div>
        <div class="row-num"><span id="syd-range">--°</span><span class="row-num-cap">today's high</span></div>
      </div>
      <div class="row quiet" id="tile-rain">
        <div class="ico" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M32 6V3M5 34C5 18 18 8 32 8s27 10 27 26c-4-5-8-5-13.5 0C41 29 37 29 32 34c-5-5-9-5-13.5 0C13 29 9 29 5 34z"/><path d="M32 34v16a6 6 0 0 1-12 0"/></svg></div>
        <div class="row-body">
          <div class="row-label">Rain today?</div>
          <div class="row-word" id="syd-rain-head"></div>
          <div class="row-sub" id="syd-rain-sub"></div>
        </div>
      </div>
    </div>
  </section>

  <footer id="foot"></footer>
</main>

<nav id="controls" hidden aria-label="Display settings">
  <button type="button" id="btn-dim"></button>
  <button type="button" id="btn-full" hidden></button>
  <span id="awake"></span>
</nav>

<script>window.NIGHT_CLOCK = { cities: ['syd'], base: '../', cache: 'earlwood.' };</script>
<script src="../app.js"></script>
</body>
</html>
